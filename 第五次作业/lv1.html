<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //循环
    let sum = 1;
    const n = 5;
    for(let i = 1;i <= n;i++){
      sum *= i;

    }
    console.log(sum);
    //递归
    function fact(n){
      if(n === 1){
        return 1;
      }
         else{
      return n*fact(n - 1);
    }
    }
    let sum2 = fact(5);
    console.log(sum2);
 
  </script>
  
</body>
</html>
