<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    .box {
      margin: auto;
      width: 600px;
      height: 400px;
      border: 1px solid green;
      background: url(./【哲风壁纸】宁静湖景-户外风光.png) no-repeat center/cover;

    }

    h3 {
      text-align: center;
      font-weight: 500;
      font-size: 24px;
      color: aliceblue;
    }

    p {
      width: 100%;
      padding: 20px 30px;
      text-indent: 2em;
      color: #fff;
      line-height: 2;
      font-size: 18px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="box">
    <h3>《记承天寺夜游》</h3>
    <p></p>

  </div>
  <script>
    const text = '元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇（xìng）交横（héng），盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。'
    const p = document.querySelector('p')
    let i = 0
    //渲染文字函数
    function render(){
      if(i>=text.length){
        return clearTimeout(timer)
      }
     p.innerHTML += text[i]
     i++
    let timer = setTimeout(render,200)
    }
    render()

  </script>

</body>

</html>
