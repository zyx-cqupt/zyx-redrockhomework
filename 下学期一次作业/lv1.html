<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防抖节流</title>
  <style>
    .input{
      width: 400px;
      height: 50px;
      border:1px solid #000;
      padding: 0;
    }
    input{
      width: 100%;
      height: 100%;
      outline-style: none;
      margin: 0;
      font-size: 20px ;
    }
  </style>
</head>
<body>
  <div class="input">
    <input type="text">
  </div>
</body>
<script>
  //防抖函数
  const deBounce = (fn,delay) =>{
    let timer = null
    return function(){
      if(timer){
        clearTimeout(timer)
      }
      timer = setTimeout(()=>{
        fn.apply(this,arguments)
      },delay)
    }
    
  }
  //节流函数
  const throttle = (fn,delay) =>{
    let flag = true
    return function(){
       if(flag){
      flag = false
      fn.apply(this,arguments)
      setTimeout(()=>{
        flag = true
      },delay)
    }

    }
   
  }
  const input = document.querySelector('input')
  //节流
 /* input.addEventListener('input',throttle(()=>{
    console.log(input.value)
  },300))*/
  //防抖
  input.addEventListener('input',deBounce(()=>{
    console.log(input.value)
  },300))
</script>
</html>
